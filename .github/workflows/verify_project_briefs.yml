name: Verify Project Briefs

# 案件概要の抽出を試して結果を表示するだけ。commit も push もしない。
# Gemini のキーがCIにしか無いので、手動実行で確認に使う。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Preview project briefs
        run: npx tsx scripts/preview_project_briefs.ts
