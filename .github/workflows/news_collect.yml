name: Collect News

# 奈良の建築ニュースを全媒体から集めて news_items.json に貯める。
# 入札の収集(Daily Scrape)が止まってもニュースは止まらないよう、別のワークフローにしている。
# ブラウザを使わないので数分で終わる。

on:
  schedule:
    - cron: '30 22 * * *' # 日本時間 7:30
    - cron: '30 3 * * *'  # 日本時間 12:30
    - cron: '30 9 * * *'  # 日本時間 18:30
  workflow_dispatch:
    inputs:
      notify_test:
        description: '知らせのメールが届くかを試す(テスト用の Issue を立てて閉じる)'
        type: boolean
        default: false

concurrency:
  group: naramania-news-collect
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  collect-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect news
        env:
          # 作業フォルダの外に書く。git add -A で知らせの文までコミットしないため
          NEWS_ALERT_FILE: ${{ runner.temp }}/news_alerts.md
        run: npx tsx scripts/collect_news.ts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 府のサイトの不調でニュースの保存まで止めない
      - name: Collect Osaka prefecture design results
        continue-on-error: true
        env:
          NEWS_ALERT_FILE: ${{ runner.temp }}/news_alerts.md
        run: npx tsx scripts/collect_osaka_awards.ts

      # hashFiles は作業フォルダの中しか見ないので、知らせの有無は出力で渡す
      - name: Check alerts
        id: alerts
        env:
          NEWS_ALERT_FILE: ${{ runner.temp }}/news_alerts.md
        run: if [ -s "$NEWS_ALERT_FILE" ]; then echo "alert=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit and Push changes
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$IS_MAIN" != "true" ]; then
            echo "::notice::main ブランチ以外での実行のため commit/push をスキップしました"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: news update [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      # データを保存できた回だけ知らせる。リポジトリをウォッチしていなくてもメールが届くよう、
      # 持ち主を担当者にする(ウォッチしていないと Issue を立てただけではメールが来なかった)
      - name: Notify Osaka awards by Nara design firms
        if: ${{ github.ref == 'refs/heads/main' && steps.alerts.outputs.alert == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_FILE: ${{ runner.temp }}/news_alerts.md
          OWNER: ${{ github.repository_owner }}
        run: |
          gh issue create \
            --title "奈良の設計事務所が大阪で受注 ($(TZ=Asia/Tokyo date +%m/%d))" \
            --body-file "$ALERT_FILE" \
            --assignee "$OWNER"

      - name: Test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_test }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          url=$(gh issue create \
            --title "通知のテスト ($(TZ=Asia/Tokyo date '+%m/%d %H:%M'))" \
            --body "奈良の設計事務所が大阪で受注したときの知らせが、メールで届くかを確かめるためのテストです。" \
            --assignee "$OWNER")
          gh issue close "$url" --comment "テストなので閉じました。"
