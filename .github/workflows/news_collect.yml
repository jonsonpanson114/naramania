name: Collect News

# 奈良の建築ニュースを全媒体から集めて news_items.json に貯める。
# 入札の収集(Daily Scrape)が止まってもニュースは止まらないよう、別のワークフローにしている。
# ブラウザを使わないので数分で終わる。

on:
  schedule:
    - cron: '30 22 * * *' # 日本時間 7:30
    - cron: '30 3 * * *'  # 日本時間 12:30
    - cron: '30 9 * * *'  # 日本時間 18:30
  workflow_dispatch:

concurrency:
  group: naramania-news-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect news
        run: npx tsx scripts/collect_news.ts

      - name: Commit and Push changes
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$IS_MAIN" != "true" ]; then
            echo "::notice::main ブランチ以外での実行のため commit/push をスキップしました"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: news update [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
